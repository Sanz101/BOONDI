<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BOONDI"/>
<title>BOONDI</title>
<link rel="stylesheet" href="styles.css">
<style>
  html,body{margin:0;padding:0;background:#fff;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:40px}
  .boot .mk{width:56px;height:56px;border-radius:50%;background:#222;color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;font-family:Georgia,serif;margin:0 auto 14px}
  .boot .sp{width:24px;height:24px;border:2px solid #e5e5e5;border-top-color:#222;border-radius:50%;animation:spin .8s linear infinite;margin:20px auto 0}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="app"><div class="boot"><div><div class="mk">b</div><div class="sp"></div></div></div></div>
<div id="toast" class="toast"></div>

<script src="shared.js"></script>
<script>
(function(){
  "use strict";

  function tryAutoLogin(){
    var saved = SweetOps.getRemember();
    if (!saved || !saved.id || !saved.pw) return false;
    var u = SweetOps.users.find(function(x){ return x.id===saved.id; });
    if (!u || u.password!==saved.pw){ SweetOps.clearRemember(); return false; }
    SweetOps.setUser(u);
    document.body.classList.add("leaving");
    setTimeout(function(){ window.location.href = SweetOps.roleHome(u) + ".html"; }, 200);
    return true;
  }

  function renderLanding(){
    var users = SweetOps.users;
    var rows = users.map(function(u,i){
      return '<button class="land-user" data-login="'+u.id+'">' +
        '<span class="numb">0'+(i+1)+'</span>' +
        '<span style="flex:1">' +
          '<span class="n">'+u.name+'</span>' +
          '<span class="r">'+SweetOps.roleLabel(u.role)+'</span>' +
        '</span>' +
        '<span class="chev">'+SweetOps.icon("chev",18)+'</span>' +
      '</button>';
    }).join("");

    document.getElementById("app").innerHTML =
      '<div class="land"><div class="land-in">' +
        '<div class="land-mark">' +
          '<div class="mk">b</div>' +
          '<div><div class="nm">BOONDI</div><div class="es">Est. 2026</div></div>' +
        '</div>' +
        '<h1 class="land-title">Sweets,<br>tracked<br><em>honestly.</em></h1>' +
        '<p class="land-tag">Five partners. Two kitchens. One shared truth for stock, sales and profit.</p>' +
        '<div class="land-sub">Sign in</div>' +
        '<div class="land-list">'+rows+'</div>' +
        '<p class="land-foot">Jennings → Nishmi · internal tool for the five.</p>' +
      '</div></div>';
  }

  function openPassword(userId){
    var u = SweetOps.users.find(function(x){ return x.id===userId; });
    if (!u) return;
    var saved = SweetOps.getRemember();
    var remembered = saved && saved.id===u.id;

    var scrim = document.createElement("div");
    scrim.className = "scrim";
    scrim.innerHTML =
      '<div class="sheet" role="dialog" aria-modal="true">' +
        '<div class="ic-badge">'+SweetOps.icon("person",22)+'</div>' +
        '<h2>'+u.name+'</h2>' +
        '<p>'+SweetOps.roleLabel(u.role)+'</p>' +
        '<div class="field" style="margin-top:18px">' +
          '<input id="pw" type="password" placeholder=" " autocomplete="off" inputmode="text">' +
          '<label>Password</label>' +
        '</div>' +
        '<label class="check">' +
          '<input type="checkbox" id="remember" '+(remembered?'checked':'')+'>' +
          '<span>Remember this device</span>' +
        '</label>' +
        '<p id="err" style="color:var(--ink);font-size:12.5px;margin:6px 0 0;min-height:16px"></p>' +
        '<div class="actions">' +
          '<button class="btn btn-ghost" data-cancel>Cancel</button>' +
          '<button class="btn btn-solid" data-go>Sign in</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(scrim);

    var input = scrim.querySelector("#pw");
    var remember = scrim.querySelector("#remember");
    var err = scrim.querySelector("#err");
    setTimeout(function(){ input.focus(); }, 80);

    function tryLogin(){
      if (input.value === u.password){
        if (remember.checked) SweetOps.saveRemember(u, input.value);
        else SweetOps.clearRemember();
        SweetOps.setUser(u);
        document.body.classList.add("leaving");
        setTimeout(function(){ window.location.href = SweetOps.roleHome(u) + ".html"; }, 180);
      } else {
        err.textContent = "Incorrect password.";
        input.value = ""; input.focus();
        var sheet = scrim.querySelector(".sheet");
        if (sheet.animate){
          sheet.animate(
            [{transform:"translateX(0)"},{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}],
            {duration:200, easing:"ease-out"}
          );
        }
      }
    }
    input.addEventListener("keydown", function(ev){ if (ev.key==="Enter"){ ev.preventDefault(); tryLogin(); } });
    scrim.addEventListener("click", function(ev){
      if (ev.target===scrim) return scrim.remove();
      var b = ev.target.closest ? ev.target.closest("button") : null;
      if (!b) return;
      if (b.hasAttribute("data-cancel")) scrim.remove();
      else if (b.hasAttribute("data-go")) tryLogin();
    });
  }

  document.addEventListener("click", function(e){
    var el = e.target;
    while (el && el !== document){
      if (el.matches && el.matches("[data-login]")) return openPassword(el.getAttribute("data-login"));
      el = el.parentNode;
    }
  });

  if (!tryAutoLogin()) renderLanding();
})();
</script>
</body>
</html>
