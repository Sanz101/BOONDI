<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BOONDI"/>
<title>BOONDI — Stock keeper</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="shared.js"></script>
<script>
(function(){
  "use strict";
  var me = SweetOps.requireUser();
  if (!me) return;
  if (me.role !== "stockkeeper"){ window.location.replace(SweetOps.roleHome(me)+".html"); return; }
  SweetOps.setPage("stockkeeper");

  document.getElementById("app").innerHTML =
    SweetOps.appBar(me) +
    '<main>' + SweetOps.loadingView() + '</main>' +
    SweetOps.dock(me, 0);

  function render(){
    var c = SweetOps.calc();
    var pending = SweetOps.pendingForUser(me);
    var s = SweetOps.getState();

    var recentPack = s.packaging.slice().reverse().slice(0,3).map(function(k){
      var used = Number(k.packets)*SweetOps.PACKET_G/1000;
      return '<div class="row">' +
        '<span class="row-ico">'+SweetOps.icon("box",16)+'</span>' +
        '<span class="row-grow"><span class="row-t1">'+k.packets+' packets</span>' +
        '<span class="row-t2">'+SweetOps.num(used,2)+' kg used · '+k.by+'</span></span>' +
        '<span class="chip '+(k.status==="Confirmed"?"solid":"hollow")+'">'+(k.status==="Confirmed"?"OK":"Pending")+'</span>' +
      '</div>';
    }).join("");
    var recentTrans = s.transfers.slice().reverse().slice(0,3).map(function(t){
      return '<div class="row">' +
        '<span class="row-ico">'+SweetOps.icon("truck",16)+'</span>' +
        '<span class="row-grow"><span class="row-t1">'+t.packets+' packets → Nishmi</span>' +
        '<span class="row-t2">'+t.by+' · '+SweetOps.fmtDate(t.date)+'</span></span>' +
        '<span class="chip '+(t.status==="Confirmed"?"solid":"hollow")+'">'+(t.status==="Confirmed"?"OK":"Pending")+'</span>' +
      '</div>';
    }).join("");

    var lastLoss = '';
    if (c.losses.length){
      var last = c.losses[c.losses.length-1];
      lastLoss = '<div class="note" style="margin-bottom:16px">' +
        '<b>Last intake loss · '+last.lossPct.toFixed(1)+'%</b><br>' +
        'From '+SweetOps.num(last.intakeKg,1)+' kg ('+last.supplier+') you packed '+last.packetsUsed+' packets using '+SweetOps.num(last.usedKg,2)+' kg — loss '+SweetOps.num(last.lossKg,2)+' kg.' +
      '</div>';
    }

    document.getElementById("app").innerHTML =
      SweetOps.appBar(me) +
      '<main>' +
        '<div class="head"><h1>Jennings workspace</h1>' +
          '<p>Package raw sweets, then send packets to Nishmi.</p></div>' +

        '<div class="grid" style="gap:8px;margin-bottom:16px">' +
          SweetOps.announcementsBlock(me, c) +
        '</div>' +

        '<div style="margin-bottom:16px">' +
          '<div style="font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px">Current stock</div>' +
          SweetOps.stockStrip(c) +
        '</div>' +

        lastLoss +

        '<div class="grid g2" style="margin-bottom:16px">' +
          '<div class="card"><div class="card-hd"><h3>Package sweets</h3>' +
            '<span class="chip hollow">'+SweetOps.PACKET_G+' g / packet</span></div>' +
            '<div class="card-bd pad">' +
              '<div class="field"><input id="k-pkt" type="number" min="0" step="1" placeholder=" " oninput="SweetOps.packCalc()"><label>Packets produced</label></div>' +
              '<div class="note" id="k-calc" style="margin-top:12px">Enter packets to see raw used.</div>' +
              '<div style="margin-top:14px"><button class="btn btn-solid btn-block" data-action="addPackaging">'+
                SweetOps.icon("box",18)+' Record packaging</button></div>' +
            '</div></div>' +
          '<div class="card"><div class="card-hd"><h3>Send to Nishmi</h3></div>' +
            '<div class="card-bd pad">' +
              '<div class="field"><input id="t-pkt" type="number" min="1" step="1" placeholder=" "><label>Packets to send</label></div>' +
              '<div class="note" style="margin-top:12px">Available at Jennings: <b>'+SweetOps.num(c.jenningsPackets)+' packets</b></div>' +
              '<div style="margin-top:14px"><button class="btn btn-solid btn-block" data-action="addTransfer">'+
                SweetOps.icon("truck",18)+' Send to Nishmi</button></div>' +
            '</div></div>' +
        '</div>' +

        '<div class="grid g2">' +
          '<div class="card"><div class="card-hd"><h3>Recent packaging</h3></div>' +
            '<div class="rows">'+(recentPack || '<div class="empty">No runs yet</div>')+'</div></div>' +
          '<div class="card"><div class="card-hd"><h3>Recent transfers</h3></div>' +
            '<div class="rows">'+(recentTrans || '<div class="empty">No transfers yet</div>')+'</div></div>' +
        '</div>' +
      '</main>' +
      SweetOps.dock(me, pending.length);

    SweetOps.animateNumbers();
  }

  SweetOps.packCalc = function(){
    var el = document.getElementById("k-calc");
    var input = document.getElementById("k-pkt");
    if (!el || !input) return;
    var pkt = parseInt(input.value,10)||0;
    if (!pkt){ el.innerHTML = "Enter packets to see raw used."; return; }
    var used = pkt * SweetOps.PACKET_G / 1000;
    var available = SweetOps.calc().jenningsKg;
    var bad = used > available;
    el.innerHTML = 'Raw used: <b>'+SweetOps.num(used,2)+' kg</b><br>Available: <b>'+SweetOps.num(available,2)+' kg</b>' +
      (bad ? '<br><b>Not enough raw stock.</b>' : '');
  };

  document.addEventListener("click", function(e){
    var btn = null, el = e.target;
    while (el && el !== document){
      if (el.matches && el.matches("[data-action]")){ btn = el; break; }
      el = el.parentNode;
    }
    if (!btn) return;
    var a = btn.getAttribute("data-action");
    if (a==="addPackaging") return doPack(btn);
    if (a==="addTransfer") return doTransfer(btn);
  });

  function doPack(btn){
    var pkt = parseInt((document.getElementById("k-pkt")||{}).value,10);
    if (!(pkt>0)) return SweetOps.toast("Enter packets packed");
    var c = SweetOps.calc();
    if (pkt * SweetOps.PACKET_G / 1000 > c.jenningsKg) return SweetOps.toast("Not enough raw stock");
    SweetOps.btnBusy(btn, "Recording…");
    SweetOps.addPackaging(me, pkt).then(function(){
      SweetOps.btnDone(btn, "Recorded");
      SweetOps.toast(pkt+" packets submitted");
      setTimeout(render, 300);
    }).catch(function(err){
      SweetOps.btnFail(btn);
      SweetOps.toast("Failed: "+err.message);
    });
  }
  function doTransfer(btn){
    var pkt = parseInt((document.getElementById("t-pkt")||{}).value,10);
    if (!(pkt>0)) return SweetOps.toast("Enter packet count");
    var c = SweetOps.calc();
    if (pkt > c.jenningsPackets) return SweetOps.toast("Only "+c.jenningsPackets+" available");
    SweetOps.btnBusy(btn, "Sending…");
    SweetOps.addTransfer(me, pkt).then(function(){
      SweetOps.btnDone(btn, "Sent");
      SweetOps.toast("Transfer of "+pkt+" packets sent");
      setTimeout(render, 300);
    }).catch(function(err){
      SweetOps.btnFail(btn);
      SweetOps.toast("Failed: "+err.message);
    });
  }

  SweetOps.loadAll().then(function(){
    SweetOps.onRefresh(render);
    var q = SweetOps.pendingForUser(me);
    render();
    if (q.length) setTimeout(function(){ SweetOps.showConfirmQueue(render); }, 400);
  }).catch(function(err){
    document.getElementById("app").innerHTML =
      SweetOps.appBar(me) + '<main>' + SweetOps.errorView(err.message) + '</main>' + SweetOps.dock(me, 0);
  });
})();
</script>
</body>
</html>
