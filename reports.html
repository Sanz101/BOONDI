<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#FFFFFF"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BOONDI"/>
<title>BOONDI — Reports</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>

<script src="shared.js"></script>
<script>
(function(){
  "use strict";
  var me = SweetOps.requireUser();
  if (!me) return;
  SweetOps.setPage("reports");

  document.getElementById("app").innerHTML =
    SweetOps.appBar(me) +
    '<main>' + SweetOps.loadingView() + '</main>' +
    SweetOps.dock(me, 0);

  function render(){
    var c = SweetOps.calc();
    var pending = SweetOps.pendingForUser(me);
    var share = c.profit / 5;

    var forecastCls = c.nishmiDays < 2 ? "crit" : c.nishmiDays < 4 ? "warn" : "good";
    var forecastTitle =
      c.nishmiDays < 2 ? "Restock Nishmi now" :
      c.nishmiDays < 4 ? "Transfer within a day" : "Stock healthy";
    var forecastBody =
      c.nishmiDays < 2 ? "Send " + c.needTransfer + " packets from Jennings to cover the next few days."
      : c.nishmiDays < 4 ? "Prepare " + c.needTransfer + " packets for the next transfer."
      : "Nishmi has " + c.nishmiDays.toFixed(1) + " days of stock.";

    var stockoutLabel = c.stockoutDate
      ? c.stockoutDate.toLocaleDateString("en-GB",{day:"2-digit",month:"short"}) : "—";

    var max = Math.max.apply(null, c.days.map(function(d){ return d.qty; }).concat([Math.ceil(c.avgDaily||1)]));
    var chart = '<div class="chart">' + c.days.map(function(d){
      var pct = max > 0 ? (d.qty/max)*100 : 0;
      return '<div class="bcol">' +
        '<div class="bv">'+(d.qty||"")+'</div>' +
        '<div class="bar" style="height:'+Math.max(3,pct)+'%"></div>' +
        '<div class="bl">'+d.label+'</div></div>';
    }).join("") + '</div>';

    var partnerRows = SweetOps.users.map(function(u){
      return '<div class="row">' +
        '<span class="row-ico">'+u.name[0]+'</span>' +
        '<span class="row-grow">' +
          '<span class="row-t1">'+u.name+'</span>' +
          '<span class="row-t2">'+SweetOps.roleLabel(u.role)+'</span>' +
        '</span>' +
        '<span class="row-amt">'+SweetOps.money(share)+'</span></div>';
    }).join("");

    var lossRows = c.losses.map(function(l){
      return '<div class="row">' +
        '<span class="row-grow">' +
          '<span class="row-t1">'+l.intakeId+' · '+SweetOps.num(l.intakeKg,1)+' kg from '+l.supplier+'</span>' +
          '<span class="row-t2">'+l.packetsUsed+' packets · used '+SweetOps.num(l.usedKg,2)+' kg · '+SweetOps.fmtDate(l.date)+'</span>' +
        '</span>' +
        '<span class="row-amt" style="font-size:12px">'+SweetOps.num(l.lossKg,2)+' kg<br><span style="color:var(--ink-3);font-weight:400">'+l.lossPct.toFixed(1)+'%</span></span></div>';
    }).join("");

    var trendArrow = c.trend > 5 ? "↑" : c.trend < -5 ? "↓" : "→";
    var trendLabel = (c.trend >= 0 ? "+" : "") + c.trend.toFixed(0) + "%";

    document.getElementById("app").innerHTML =
      SweetOps.appBar(me) +
      '<main>' +
        '<div class="head">' +
          '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap">' +
            '<div><h1>Reports</h1><p>Demand, forecast and profit — all in one place.</p></div>' +
            '<button class="btn btn-ghost" data-export>'+SweetOps.icon("download",16)+' Export</button>' +
          '</div>' +
        '</div>' +

        '<div class="ann '+forecastCls+'" style="margin-bottom:16px">' +
          '<span class="ann-ic">'+SweetOps.icon(forecastCls==="good"?"check":"warn",22)+'</span>' +
          '<div class="ann-body">' +
            '<span class="ann-t">'+forecastTitle+'</span>' +
            '<span class="ann-b">'+forecastBody+'</span>' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:16px">' +
          '<div class="card-hd"><h3>Prediction</h3>' +
            '<span class="chip '+(c.trend>=0?"solid":"hollow")+'">'+trendArrow+' '+trendLabel+' week</span></div>' +
          '<div class="card-bd pad">' +
            '<div class="grid" style="grid-template-columns:1fr 1fr;gap:16px">' +
              '<div class="stat" style="padding:0">' +
                '<div class="lab">Avg daily (weighted)</div>' +
                '<div class="val">'+c.avgDaily.toFixed(1)+'<small>pkts</small></div>' +
                '<div class="sub">Volatility ±'+c.volatility.toFixed(1)+'</div>' +
              '</div>' +
              '<div class="stat" style="padding:0">' +
                '<div class="lab">Stockout date</div>' +
                '<div class="val" style="font-size:22px">'+stockoutLabel+'</div>' +
                '<div class="sub">'+(c.nishmiDays===Infinity?"—":c.nishmiDays.toFixed(1)+" days away")+'</div>' +
              '</div>' +
            '</div>' +
            '<div class="note" style="margin-top:16px">' +
              '<b>Reorder point: '+c.reorderPoint+' packets</b> — keeps you covered for '+Math.ceil(c.safetyStock)+' packets of buffer.' +
              (c.needTransfer > 0 ? '<br>You need <b>'+c.needTransfer+' more packets</b> at Nishmi.' : '<br>Nishmi is above the reorder point.') +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:16px">' +
          '<div class="card-hd"><h3>Demand · last 7 days</h3>' +
            '<span style="font-size:12px;color:var(--ink-3)">'+SweetOps.num(c.weekSold)+' packets</span></div>' +
          '<div class="card-bd pad">'+chart+
            '<div style="display:flex;justify-content:space-between;margin-top:14px;font-size:12px;color:var(--ink-3)">' +
              '<span>This week <b style="color:var(--ink)">'+c.weekSold+'</b></span>' +
              '<span>Last week <b style="color:var(--ink)">'+c.prevWeekSold+'</b></span>' +
              '<span>Avg <b style="color:var(--ink)">'+c.avgDaily.toFixed(1)+'</b>/day</span>' +
            '</div>' +
          '</div>' +
        '</div>' +

        '<div class="grid g2" style="margin-bottom:16px">' +
          '<div class="card"><div class="card-hd"><h3>Stock position</h3></div>' +
            '<div class="rows">' +
              '<div class="row"><span class="row-ico">'+SweetOps.icon("scale",16)+'</span>' +
                '<span class="row-grow"><span class="row-t1">Jennings · raw</span>' +
                '<span class="row-t2">'+(c.rawDays===Infinity?'—':c.rawDays.toFixed(1)+' days cover')+'</span></span>' +
                '<span class="row-amt">'+SweetOps.num(c.jenningsKg,1)+'<small style="font-weight:400;color:var(--ink-3)"> kg</small></span></div>' +
              '<div class="row"><span class="row-ico">'+SweetOps.icon("box",16)+'</span>' +
                '<span class="row-grow"><span class="row-t1">Jennings · packets</span>' +
                '<span class="row-t2">'+(c.jenningsDays===Infinity?'—':c.jenningsDays.toFixed(1)+' days cover')+'</span></span>' +
                '<span class="row-amt">'+SweetOps.num(c.jenningsPackets)+'</span></div>' +
              '<div class="row"><span class="row-ico">'+SweetOps.icon("truck",16)+'</span>' +
                '<span class="row-grow"><span class="row-t1">Nishmi · packets</span>' +
                '<span class="row-t2">'+(c.nishmiDays===Infinity?'—':c.nishmiDays.toFixed(1)+' days cover')+'</span></span>' +
                '<span class="row-amt">'+SweetOps.num(c.nishmiPackets)+'</span></div>' +
            '</div></div>' +
          '<div class="card"><div class="card-hd"><h3>Financials</h3></div>' +
            '<div class="rows">' +
              '<div class="row"><span class="row-grow"><span class="row-t1">Revenue</span>' +
                '<span class="row-t2">'+SweetOps.num(c.packetsSold)+' packets · '+SweetOps.money(c.cpp)+'/packet</span></span>' +
                '<span class="row-amt">'+SweetOps.money(c.revenue)+'</span></div>' +
              '<div class="row"><span class="row-grow"><span class="row-t1">Cost of goods</span>' +
                '<span class="row-t2">Procurement + processing</span></span>' +
                '<span class="row-amt">'+SweetOps.money(c.cogs)+'</span></div>' +
              '<div class="row"><span class="row-grow"><span class="row-t1"><b>Net profit</b></span>' +
                '<span class="row-t2">'+(c.revenue?((c.profit/c.revenue)*100).toFixed(1):"0")+'% margin</span></span>' +
                '<span class="row-amt">'+SweetOps.money(c.profit)+'</span></div>' +
            '</div></div>' +
        '</div>' +

        '<div class="card" style="margin-bottom:16px">' +
          '<div class="card-hd"><h3>Partner split</h3>' +
            '<span style="font-size:12px;color:var(--ink-3)">'+SweetOps.money(c.profit)+' ÷ 5</span></div>' +
          '<div class="rows">'+partnerRows+'</div>' +
        '</div>' +

        '<div class="card">' +
          '<div class="card-hd"><h3>Processing loss</h3>' +
            '<span style="font-size:12px;color:var(--ink-3)">'+SweetOps.num(c.lossKg,2)+' kg · ≈'+SweetOps.money(c.lossKg*c.avgCostKg)+'</span></div>' +
          '<div class="rows">'+(lossRows || '<div class="empty">No confirmed intakes yet</div>')+'</div>' +
        '</div>' +
      '</main>' +
      SweetOps.dock(me, pending.length);

    SweetOps.animateNumbers();
  }

  document.addEventListener("click", function(e){
    var el = e.target;
    while (el && el !== document){
      if (el.matches && el.matches("[data-export]")){
        var btn = el;
        SweetOps.btnBusy(btn, "Exporting…");
        setTimeout(function(){
          try {
            SweetOps.exportReports();
            SweetOps.btnDone(btn, "Exported");
          } catch(err){
            SweetOps.btnFail(btn);
            SweetOps.toast("Export failed");
          }
        }, 60);
        return;
      }
      el = el.parentNode;
    }
  });

  SweetOps.loadAll().then(function(){
    SweetOps.onRefresh(render);
    render();
  }).catch(function(err){
    document.getElementById("app").innerHTML =
      SweetOps.appBar(me) + '<main>' + SweetOps.errorView(err.message) + '</main>' + SweetOps.dock(me, 0);
  });
})();
</script>
</body>
</html>
